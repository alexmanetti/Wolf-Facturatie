<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WOLF — Facturatie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-firestore-compat.min.js"></script>
<style>
:root{
  --ink:#151821;
  --ink-soft:#5b6472;
  --line:#e2e6ec;
  --surface:#ffffff;
  --surface-2:#f4f6f9;
  --surface-3:#eaeef3;
  --brand-black:#12141c;
  --brand-black-2:#1b1e29;
  --brand-blue:#5c85b9;
  --brand-blue-light:#9db8dd;
  --brand-blue-deep:#3c5f8f;
  --danger:#c15b5b;
  --danger-bg:#fbeeee;
  --success:#3f8f63;
  --success-bg:#eaf5ef;
  --warn:#b9852f;
  --warn-bg:#faf1e2;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(18,20,28,0.06), 0 6px 20px -12px rgba(18,20,28,0.18);
  color-scheme: light;
}
:root[data-theme="dark"], :root:not([data-theme="light"]) {
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e9ecf2;
    --ink-soft:#a2acbc;
    --line:#2a2e3a;
    --surface:#1a1d27;
    --surface-2:#14161e;
    --surface-3:#22252f;
    --brand-black:#0b0c11;
    --brand-black-2:#15171f;
    --danger-bg:#2c1c1d;
    --success-bg:#132a20;
    --warn-bg:#2b2214;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e9ecf2;
  --ink-soft:#a2acbc;
  --line:#2a2e3a;
  --surface:#1a1d27;
  --surface-2:#14161e;
  --surface-3:#22252f;
  --brand-black:#0b0c11;
  --brand-black-2:#15171f;
  --danger-bg:#2c1c1d;
  --success-bg:#132a20;
  --warn-bg:#2b2214;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--surface-2);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
button{font-family:inherit;}
a{color:var(--brand-blue-deep);}
::selection{background:var(--brand-blue-light);color:#12141c;}

/* ---------- shell layout ---------- */
#shell{display:flex;min-height:100vh;}
#sidebar{
  width:232px;flex:none;
  background:var(--brand-black);
  color:#dfe6f2;
  display:flex;flex-direction:column;
  padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));
  position:sticky;top:0;height:100vh;
  overflow-y:auto;
}
#sidebar .logowrap{padding:6px 8px 20px;}
#sidebar .logowrap img{width:100%;max-width:150px;display:block;}
.navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;flex:1;}
.navlist button{
  width:100%;text-align:left;background:none;border:none;color:#c4cddc;
  padding:10px 12px;border-radius:8px;font-size:14px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s,color .12s;
}
.navlist button svg{flex:none;opacity:.85;}
.navlist button:hover{background:var(--brand-black-2);color:#fff;}
.navlist button.active{background:var(--brand-blue-deep);color:#fff;}
.sidebar-foot{padding:10px 10px 2px;border-top:1px solid #262a36;margin-top:10px;font-size:12px;color:#7f8aa0;}
.sidebar-foot strong{color:#c4cddc;display:block;font-size:13px;margin-bottom:2px;}

#topbar{
  display:none;
  position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--brand-black);color:#fff;
  align-items:center;gap:12px;padding:12px 14px;
}
#topbar img{height:22px;}
#topbar .hamburger{background:none;border:none;color:#fff;padding:6px;cursor:pointer;}
#topbar .hamburger svg{display:block;}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#content{flex:1;padding:26px 32px 60px;max-width:1180px;width:100%;margin:0 auto;}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.pagehead h1{font-size:22px;margin:0 0 4px;color:var(--ink);}
.pagehead p{margin:0;color:var(--ink-soft);font-size:13.5px;}

.btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:9px 15px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:transform .05s, border-color .12s, background .12s;
  white-space:nowrap;
}
.btn:hover{border-color:var(--brand-blue);}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--brand-blue-deep);border-color:var(--brand-blue-deep);color:#fff;}
.btn-primary:hover{background:var(--brand-blue);border-color:var(--brand-blue);}
.btn-danger{color:var(--danger);border-color:var(--danger);background:transparent;}
.btn-danger:hover{background:var(--danger-bg);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-3);border-color:transparent;}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn svg{flex:none;}

/* cards / dashboard */
.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.stat-card .label{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;}
.stat-card .value{font-family:'Space Grotesk';font-size:24px;font-weight:600;}
.stat-card .sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.stat-card.accent{background:var(--brand-black);border-color:var(--brand-black);color:#fff;}
.stat-card.accent .label{color:#9db3d1;}
.stat-card.accent .value{color:#fff;}
.stat-card.accent .sub{color:#8b98af;}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.panel + .panel{margin-top:18px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
.panel-head h3{margin:0;font-size:15px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:left;font-size:11.5px;text-transform:none;color:var(--ink-soft);font-weight:600;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);}
tbody td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.rowactions{display:flex;gap:6px;justify-content:flex-end;}
.emptystate{padding:44px 20px;text-align:center;color:var(--ink-soft);}
.emptystate .big{font-family:'Space Grotesk';font-size:16px;color:var(--ink);margin-bottom:6px;}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11.5px;font-weight:600;}
.tag-concept{background:var(--surface-3);color:var(--ink-soft);}
.tag-verzonden{background:#e7eef8;color:var(--brand-blue-deep);}
.tag-late{background:var(--danger-bg);color:var(--danger);}
.tag-betaald{background:var(--success-bg);color:var(--success);}
.tag-credit{background:var(--danger-bg);color:var(--danger);}
.tag-actief{background:var(--success-bg);color:var(--success);}
.tag-inactief{background:var(--surface-3);color:var(--ink-soft);}

.filters{display:flex;gap:6px;flex-wrap:wrap;}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);padding:6px 12px;border-radius:100px;font-size:12.5px;font-weight:600;cursor:pointer;}
.filters button.active{background:var(--brand-black);color:#fff;border-color:var(--brand-black);}

/* forms */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;
  background:var(--surface);color:var(--ink);
}
.field textarea{resize:vertical;min-height:70px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand-blue-light);outline-offset:0;border-color:var(--brand-blue);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field-row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;}
.checkfield{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);}
.hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
fieldset{border:none;padding:0;margin:0 0 20px;}
legend{font-family:'Space Grotesk';font-size:13.5px;font-weight:600;padding:0 0 10px;color:var(--ink);}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(12,13,18,0.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:26px 14px;overflow-y:auto;}
.overlay.hidden{display:none;}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;box-shadow:0 20px 60px -20px rgba(0,0,0,0.4);margin:auto;}
.modal.wide{max-width:800px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head h2{margin:0;font-size:17px;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);}
.iconbtn{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:6px;border-radius:6px;}
.iconbtn:hover{background:var(--surface-3);color:var(--ink);}

/* invoice line editor */
.lines-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
.lines-table th{font-size:11px;text-align:left;color:var(--ink-soft);padding:0 6px 6px;font-weight:600;}
.lines-table td{padding:4px 6px;vertical-align:top;}
.lines-table input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;background:var(--surface);color:var(--ink);}
.lines-table .linetotal{padding:8px 4px;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px;}
.totalsbox{margin-left:auto;width:260px;font-size:13.5px;}
.totalsbox .row{display:flex;justify-content:space-between;padding:5px 0;}
.totalsbox .row.total{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-weight:700;font-size:15px;font-family:'Space Grotesk';}
.unbilled-list{border:1px solid var(--line);border-radius:8px;max-height:180px;overflow-y:auto;margin-bottom:14px;}
.unbilled-list label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;}
.unbilled-list label:last-child{border-bottom:none;}
.unbilled-list label:hover{background:var(--surface-2);}

/* invoice preview (also used as print source) */
.invoice-doc{background:#fff;color:#1a1a1a;border-radius:10px;padding:40px;max-width:720px;margin:0 auto;font-size:13px;}
.invoice-doc .idoc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:34px;gap:20px;}
.invoice-doc .idoc-top img{height:90px;}
.invoice-doc .idoc-company{text-align:right;font-size:12px;line-height:1.55;color:#333;}
.invoice-doc .idoc-company strong{color:#111;font-size:13.5px;}
.invoice-doc h2.idoc-title{font-family:'Space Grotesk';font-size:26px;margin:0 0 2px;color:#3c5f8f;}
.invoice-doc h2.idoc-title.credit{color:#b34848;}
.invoice-doc .idoc-meta{color:#555;font-size:12.5px;margin-bottom:26px;}
.invoice-doc .idoc-to{margin-bottom:26px;}
.invoice-doc .idoc-to .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#888;margin-bottom:4px;}
.invoice-doc .idoc-customernote{display:block;font-size:12px;color:#555;margin-top:4px;font-style:italic;}
.invoice-doc table{width:100%;border-collapse:collapse;margin-bottom:16px;}
.invoice-doc thead th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#777;text-align:left;padding:0 8px 8px 0;border-bottom:1.5px solid #222;}
.invoice-doc tbody td{padding:9px 8px 9px 0;border-bottom:1px solid #e6e6e6;font-size:13px;}
.invoice-doc td.num,.invoice-doc th.num{text-align:right;font-variant-numeric:tabular-nums;}
.invoice-doc .idoc-totals{width:260px;margin-left:auto;font-size:13px;}
.invoice-doc .idoc-totals .row{display:flex;justify-content:space-between;padding:4px 0;}
.invoice-doc .idoc-totals .row.total{border-top:1.5px solid #222;margin-top:4px;padding-top:8px;font-weight:700;font-size:15px;}
.invoice-doc .idoc-footer{margin-top:32px;padding-top:16px;border-top:1px solid #e6e6e6;font-size:11.5px;color:#777;white-space:pre-line;}

.banner{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:#8a611f;border:1px solid #eddcb3;padding:11px 16px;border-radius:10px;margin-bottom:18px;font-size:13px;}
:root[data-theme="dark"] .banner{color:#e8c789;border-color:#5a4520;}
.banner button{margin-left:auto;}

.toast-wrap{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--brand-black);color:#fff;padding:10px 18px;border-radius:100px;font-size:13.5px;box-shadow:0 8px 24px -8px rgba(0,0,0,0.4);}

.helpline{color:var(--ink-soft);font-size:12.5px;}
.searchbox{position:relative;}
.searchbox input{padding-left:32px !important;}
.searchbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5;}

@media(max-width:880px){
  #sidebar{display:none;}
  #topbar{display:flex;}
  #content{padding:18px 16px 60px;}
  .grid-cards{grid-template-columns:1fr 1fr;}
  .field-row,.field-row3{grid-template-columns:1fr;}
  table{font-size:13px;}
  thead{display:none;}
  tbody tr{display:block;border-bottom:8px solid var(--surface-2);}
  tbody td{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);text-align:right;}
  tbody td::before{content:attr(data-label);text-align:left;color:var(--ink-soft);font-weight:600;font-size:12px;}
  tbody td.rowactions{justify-content:flex-end;}
  tbody td.rowactions::before{content:none;}
  .invoice-doc{padding:22px;}
}
#drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;}
#drawer-overlay.open{display:block;}
#drawer{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--brand-black);z-index:70;transform:translateX(-100%);transition:transform .18s ease;padding:18px 14px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;}
#drawer.open{transform:translateX(0);}

#print-area{position:fixed;top:-99999px;left:-99999px;width:0;height:0;overflow:hidden;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;top:0;left:0;width:100%;height:auto;overflow:visible;}
}
#loginGate{position:fixed;inset:0;z-index:99999;background:var(--brand-black);display:flex;align-items:center;justify-content:center;padding:24px;}
#loginGate.hidden{display:none;}
#loginGateBox{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;max-width:340px;width:100%;text-align:center;}
#loginGateBox img{width:110px;margin-bottom:18px;}
#loginGateBox h2{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:0 0 16px;color:var(--ink);}
#loginGateBox input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:15px;margin-bottom:12px;background:var(--surface);color:var(--ink);}
#loginGateBox button{width:100%;padding:11px 12px;border:none;border-radius:var(--radius-sm);background:var(--brand-blue-deep);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
#loginGateBox button:active{opacity:0.85;}
#loginGateError{color:var(--danger);font-size:13px;margin:-4px 0 12px;min-height:16px;}
#appRoot{display:none;}
#appRoot.unlocked{display:contents;}
</style>
</head>
<body>

<div id="loginGate">
  <div id="loginGateBox">
    <img id="loginGateLogo" alt="WOLF">
    <h2>Log in</h2>
    <input type="email" id="loginGateEmail" placeholder="E-mailadres" autocomplete="username">
    <input type="password" id="loginGateInput" placeholder="Wachtwoord" autocomplete="current-password">
    <div id="loginGateError"></div>
    <button id="loginGateBtn" type="button">Inloggen</button>
  </div>
</div>

<div id="appRoot">
<div id="topbar">
  <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <img id="topbarLogo" alt="WOLF">
</div>

<div id="drawer-overlay"></div>
<div id="drawer">
  <div class="logowrap"><img id="drawerLogo" alt="WOLF" style="width:120px"></div>
  <ul class="navlist" id="navlistMobile"></ul>
  <button type="button" class="btn btn-sm" id="logoutBtnMobile" style="width:calc(100% - 32px);margin:12px 16px;">Uitloggen</button>
</div>

<div id="shell">
  <div id="sidebar">
    <div class="logowrap"><img id="sidebarLogo" alt="WOLF"></div>
    <ul class="navlist" id="navlistDesktop"></ul>
    <div class="sidebar-foot">
      <strong id="sidebarCompanyName">WOLF</strong>
      Facturatie
      <button type="button" class="btn btn-sm" id="logoutBtnDesktop" style="width:100%;margin-top:10px;">Uitloggen</button>
    </div>
  </div>
  <div id="main">
    <div id="content"></div>
  </div>
</div>

<div class="overlay hidden" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="print-area"></div>

</div>

<script>

/* ---------------- utilities ---------------- */
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowIso(){ return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, days){ const d = new Date(dateStr); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function fmtDate(dateStr){ if(!dateStr) return '—'; const d = new Date(dateStr+'T00:00:00'); if(isNaN(d)) return dateStr; return d.toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtMoney(n){ n = Number(n)||0; return new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n); }
function fmtNum(n,dec){ return new Intl.NumberFormat('nl-NL',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||2}).format(Number(n)||0); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function byId(arr,id){ return (arr||[]).find(x=>x.id===id); }
function showToast(msg){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className='toast'; t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}
window.addEventListener('unhandledrejection', (event)=>{
  const msg = (event.reason && event.reason.message) ? event.reason.message : String(event.reason||'onbekende fout');
  showToast('Opslaan mislukt: ' + msg + ' — probeer het opnieuw.');
  console.error('Unhandled error in WOLF app:', event.reason);
});

let db = null;

function initFirebase(){
  try{
    if(!firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
    fbAuth = firebase.auth();
    db = firebase.firestore();
    useDb = true;
  }catch(e){
    console.error('Firebase init failed:', e);
    db = null; useDb = false;
  }
}

async function initBackend(){
  if(!db){ initFirebase(); }
}

function lsGetAll(name){ try{ return JSON.parse(localStorage.getItem(LS_PREFIX+name)||'[]'); }catch(e){ return []; } }
function lsSetAll(name, arr){ try{ localStorage.setItem(LS_PREFIX+name, JSON.stringify(arr)); }catch(e){} }
function lsGetDoc(key){ try{ return JSON.parse(localStorage.getItem(LS_PREFIX+key)||'null'); }catch(e){ return null; } }
function lsSetDoc(key, obj){ try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(obj)); }catch(e){} }

async function getCompany(){
  if(useDb){
    try{ const snap = await db.doc('settings/company').get(); return snap.exists ? Object.assign({}, snap.data()) : null; }
    catch(e){ return lsGetDoc('company'); }
  }
  return lsGetDoc('company');
}
async function saveCompanyFull(data){
  if(useDb){ try{ await db.doc('settings/company').set(data); return; }catch(e){} }
  lsSetDoc('company', data);
}
async function updateCompany(patch){
  if(useDb){
    try{ await db.doc('settings/company').update(patch); return; }
    catch(e){ /* fall through to local merge */ }
  }
  const cur = lsGetDoc('company') || {};
  lsSetDoc('company', Object.assign({}, cur, patch));
}

async function listCollection(name){
  if(useDb){
    try{
      const snap = await db.collection(name).get();
      return snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    }catch(e){ return lsGetAll(name); }
  }
  return lsGetAll(name);
}
async function addToCollection(name, data){
  const id = data.id || uid();
  const withId = Object.assign({}, data, {id});
  if(useDb){
    await db.collection(name).doc(id).set(withId);
    return withId;
  }
  const arr = lsGetAll(name); arr.push(withId); lsSetAll(name, arr);
  return withId;
}
async function updateInCollection(name, id, patch){
  if(useDb){
    await db.collection(name).doc(id).update(patch);
    return;
  }
  const arr = lsGetAll(name);
  const i = arr.findIndex(x=>x.id===id);
  if(i>-1){ arr[i] = Object.assign({}, arr[i], patch); lsSetAll(name, arr); }
}
async function deleteFromCollection(name, id){
  if(useDb){
    await db.collection(name).doc(id).delete();
    return;
  }
  let arr = lsGetAll(name);
  arr = arr.filter(x=>x.id!==id);
  lsSetAll(name, arr);
}

const state = {
  company: null,
  customers: [],
  projects: [],
  hours: [],
  costs: [],
  kms: [],
  invoices: [],
  releasedNumbers: [],
  view: 'dashboard',
  ready: false,
  storageWarning: false,
};

function defaultCompany(){
  return {
    name: 'WOLF',
    contactName: '',
    address: '', postcode: '', city: '',
    kvk: '', btwNummer: '', iban: '', ibanName: '',
    email: '', phone: '', website: '',
    invoicePrefix: 'WOLF',
    nextNumber: 1,
    defaultVat: 21,
    kmRate: 0.25,
    paymentTermDays: 14,
    footerNote: 'Gelieve het factuurbedrag binnen de betaaltermijn over te maken onder vermelding van het factuurnummer.',
    createdAt: nowIso()
  };
}

async function loadAll(){
  const [company, customers, projects, hours, costs, kms, invoices, releasedNumbers] = await Promise.all([
    getCompany(), listCollection('customers'), listCollection('projects'), listCollection('hours'), listCollection('costs'), listCollection('kms'), listCollection('invoices'), listCollection('releasedNumbers')
  ]);
  if(!company){
    state.company = defaultCompany();
    await saveCompanyFull(state.company);
  } else {
    state.company = company;
  }
  state.customers = customers.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  state.projects = projects.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  state.hours = hours.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  state.costs = costs.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  state.kms = kms.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  state.invoices = invoices.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.sequenceNumber||0)-(a.sequenceNumber||0));
  state.releasedNumbers = releasedNumbers;
  state.ready = true;
}

/* ---------------- derived helpers ---------------- */
function customerName(id){ const c = byId(state.customers, id); return c ? c.name : '—'; }
function projectName(id){ const p = byId(state.projects, id); return p ? p.name : '—'; }
function unbilledHoursForProject(projectId){ return state.hours.filter(h=>h.projectId===projectId && !h.billed); }
function unbilledCostsForProject(projectId){ return state.costs.filter(c=>c.projectId===projectId && !c.billed); }
function unbilledKmsForProject(projectId){ return state.kms.filter(k=>k.projectId===projectId && !k.billed); }
function unbilledHoursForCustomer(customerId){ const ids = state.projects.filter(p=>p.customerId===customerId).map(p=>p.id); return state.hours.filter(h=>ids.includes(h.projectId) && !h.billed); }
function unbilledCostsForCustomer(customerId){ const ids = state.projects.filter(p=>p.customerId===customerId).map(p=>p.id); return state.costs.filter(c=>ids.includes(c.projectId) && !c.billed); }
function unbilledKmsForCustomer(customerId){ const ids = state.projects.filter(p=>p.customerId===customerId).map(p=>p.id); return state.kms.filter(k=>ids.includes(k.projectId) && !k.billed); }
function kmAmount(k){ return k.useFixedAmount ? Number(k.fixedAmount||0) : Number(k.km||0) * Number(k.rate||0); }

function invoiceDisplayStatus(inv){
  if(inv.isCredit) return 'credit';
  if(inv.status==='betaald') return 'betaald';
  if(inv.status==='verzonden'){
    if(inv.dueDate && inv.dueDate < todayStr()) return 'late';
    return 'verzonden';
  }
  return 'concept';
}
function statusLabel(s){
  return {concept:'Concept', verzonden:'Verzonden', late:'Te laat', betaald:'Betaald', credit:'Creditfactuur'}[s] || s;
}
function invoiceTotal(inv){ return (inv.lines||[]).reduce((s,l)=> s + lineTotal(l), 0); }
function lineTotal(l){ return (Number(l.quantity)||0) * (Number(l.price)||0); }
function invoiceVatBreakdown(inv){
  const map = {};
  (inv.lines||[]).forEach(l=>{
    const rate = Number(l.vat)||0;
    const amt = lineTotal(l) * rate/100;
    map[rate] = (map[rate]||0) + amt;
  });
  return map;
}
function invoiceVatTotal(inv){ return Object.values(invoiceVatBreakdown(inv)).reduce((a,b)=>a+b,0); }
function invoiceGrandTotal(inv){ return invoiceTotal(inv) + invoiceVatTotal(inv); }

function renderNav(){
  [['navlistDesktop',false],['navlistMobile',true]].forEach(([elId,isMobile])=>{
    const el = document.getElementById(elId);
    el.innerHTML = NAV.map(n=>`<li><button data-view="${n.id}" class="${state.view===n.id?'active':''}">${ICONS[n.icon]}<span>${n.label}</span></button></li>`).join('');
    el.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{ setView(b.dataset.view); if(isMobile) closeDrawer(); });
    });
  });
  document.getElementById('sidebarCompanyName').textContent = (state.company && state.company.name) || 'WOLF';
}
function openDrawer(){ document.getElementById('drawer').classList.add('open'); document.getElementById('drawer-overlay').classList.add('open'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('drawer-overlay').classList.remove('open'); }
document.getElementById('hamburgerBtn').addEventListener('click', openDrawer);
document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);

function setView(v){ state.view = v; renderNav(); render(); window.scrollTo(0,0); }

/* ---------------- modal helpers ---------------- */
function openModal(html, wide){
  document.getElementById('modalBox').className = 'modal' + (wide?' wide':'');
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalBox').innerHTML = '';
}
document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });

function confirmDialog(title, body, okLabel, onOk){
  openModal(`
    <div class="modal-head"><h2>${esc(title)}</h2><button class="iconbtn" data-close>${ICONS.close}</button></div>
    <div class="modal-body"><p style="margin:0;color:var(--ink-soft)">${body}</p></div>
    <div class="modal-foot">
      <button class="btn" data-close>Annuleren</button>
      <button class="btn btn-danger" id="confirmOkBtn">${esc(okLabel)}</button>
    </div>
  `);
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
  document.getElementById('confirmOkBtn').addEventListener('click', async ()=>{ await onOk(); closeModal(); });
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const openInvoices = state.invoices.filter(i=>!i.isCredit && (i.status==='verzonden'));
  const openAmount = openInvoices.reduce((s,i)=>s+invoiceGrandTotal(i),0);
  const lateCount = openInvoices.filter(i=>i.dueDate && i.dueDate<todayStr()).length;
  const conceptCount = state.invoices.filter(i=>i.status==='concept').length;
  const thisMonth = todayStr().slice(0,7);
  const monthTotal = state.invoices.filter(i=>i.status!=='concept' && (i.date||'').slice(0,7)===thisMonth)
    .reduce((s,i)=> s + (i.isCredit? -invoiceGrandTotal(i) : invoiceGrandTotal(i)), 0);
  const recent = state.invoices.slice(0,6);

  const currentYear = todayStr().slice(0,4);
  const finalizedThisYear = state.invoices.filter(i=>i.status!=='concept' && (i.date||'').slice(0,4)===currentYear);
  const linesThisYear = [];
  finalizedThisYear.forEach(inv=>{
    const sign = inv.isCredit ? -1 : 1;
    (inv.lines||[]).forEach(l=> linesThisYear.push({category:l.category||'materiaal', total: sign*lineTotal(l)}));
  });
  const sumCat = cat => linesThisYear.filter(l=>l.category===cat).reduce((s,l)=>s+l.total,0);
  const omzetWerk = sumCat('uren');
  const materiaalkosten = sumCat('materiaal');
  const kmVergoeding = sumCat('km');
  const totaalGefactureerd = omzetWerk + materiaalkosten + kmVergoeding;
  const omzetPerKlantMap = {};
  finalizedThisYear.forEach(inv=>{
    const naam = customerName(inv.customerId);
    const bedrag = inv.isCredit ? -invoiceTotal(inv) : invoiceTotal(inv);
    omzetPerKlantMap[naam] = (omzetPerKlantMap[naam]||0) + bedrag;
  });
  const omzetPerKlant = Object.entries(omzetPerKlantMap).map(([naam,bedrag])=>({naam,bedrag})).sort((a,b)=>b.bedrag-a.bedrag);

  return `
    <div class="pagehead">
      <div><h1>Dashboard</h1><p>Overzicht van je facturatie${state.company && state.company.name ? ' — '+esc(state.company.name):''}.</p></div>
      <div style="display:flex;gap:10px;">
        <button class="btn" data-action="new-customer">${ICONS.plus} Nieuwe klant</button>
        <button class="btn btn-primary" data-action="new-invoice">${ICONS.plus} Nieuwe factuur</button>
      </div>
    </div>
    ${state.storageWarning ? `<div class="banner">Geen cloudopslag beschikbaar in deze weergave — gegevens worden lokaal in deze browser bewaard en zijn niet zichtbaar op andere apparaten.</div>` : ''}
    ${(!state.company.address && !state.company.kvk) ? `<div class="banner">Vul je bedrijfsgegevens aan zodat ze op je facturen verschijnen. <button class="btn btn-sm" data-view="instellingen">Naar instellingen</button></div>` : ''}
    <div class="grid-cards">
      <div class="stat-card accent">
        <div class="label">Openstaand</div>
        <div class="value">${fmtMoney(openAmount)}</div>
        <div class="sub">${openInvoices.length} onbetaalde ${openInvoices.length===1?'factuur':'facturen'}</div>
      </div>
      <div class="stat-card">
        <div class="label">Te laat</div>
        <div class="value" style="color:${lateCount? 'var(--danger)':'var(--ink)'}">${lateCount}</div>
        <div class="sub">verlopen betaaltermijn</div>
      </div>
      <div class="stat-card">
        <div class="label">Concepten</div>
        <div class="value">${conceptCount}</div>
        <div class="sub">nog niet verzonden</div>
      </div>
      <div class="stat-card">
        <div class="label">Deze maand</div>
        <div class="value">${fmtMoney(monthTotal)}</div>
        <div class="sub">gefactureerd (incl. credits)</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Recente facturen</h3><button class="btn btn-sm btn-ghost" data-view="facturen">Alle facturen</button></div>
      ${recent.length===0 ? emptyState('Nog geen facturen','Maak je eerste factuur aan om ‘m hier te zien.') : `
      <table>
        <thead><tr><th>Nummer</th><th>Klant</th><th>Datum</th><th class="num">Bedrag</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${recent.map(inv=>invoiceRow(inv)).join('')}
        </tbody>
      </table>`}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Uitsplitsing gefactureerd bedrag (${currentYear}, excl. btw)</h3></div>
      <div style="padding:6px 22px 18px;">
        <p class="hint" style="margin-top:0;">Materiaal en kilometers tellen niet mee als echte omzet uit werk — dat zijn doorbelaste kosten.</p>
        <table>
          <tbody>
            <tr><td>Omzet werk (uren + vaste bedragen)</td><td class="num">${fmtMoney(omzetWerk)}</td></tr>
            <tr><td>Materiaalkosten</td><td class="num">${fmtMoney(materiaalkosten)}</td></tr>
            <tr><td>Kilometervergoeding</td><td class="num">${fmtMoney(kmVergoeding)}</td></tr>
            <tr><td><strong>Totaal</strong></td><td class="num"><strong>${fmtMoney(totaalGefactureerd)}</strong></td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Omzet per klant (${currentYear}, excl. btw)</h3></div>
      ${omzetPerKlant.length===0 ? emptyState('Nog geen facturen dit jaar','Zodra je facturen verstuurt of definitief maakt, zie je hier de verdeling per klant.') : `
      <table>
        <thead><tr><th>Klant</th><th class="num">Bedrag</th></tr></thead>
        <tbody>
          ${omzetPerKlant.map(o=>`<tr><td>${esc(o.naam)}</td><td class="num">${fmtMoney(o.bedrag)}</td></tr>`).join('')}
          <tr><td><strong>Totaal</strong></td><td class="num"><strong>${fmtMoney(omzetPerKlant.reduce((s,o)=>s+o.bedrag,0))}</strong></td></tr>
        </tbody>
      </table>`}
    </div>
  `;
}
function emptyState(big, small){
  return `<div class="emptystate"><div class="big">${esc(big)}</div><div>${esc(small)}</div></div>`;
}
function statusTagHtml(inv){
  const s = invoiceDisplayStatus(inv);
  return `<span class="tag tag-${s==='late'?'late':s}">${statusLabel(s)}</span>`;
}
function displayInvoiceNumber(inv){ return inv.number || 'Concept'; }
function invoiceRow(inv){
  const total = inv.isCredit ? -invoiceGrandTotal(inv) : invoiceGrandTotal(inv);
  return `<tr data-invoice-row="${inv.id}">
    <td data-label="Nummer"><strong style="color:${inv.isCredit?'var(--danger)':'var(--brand-blue-deep)'}">${esc(displayInvoiceNumber(inv))}</strong></td>
    <td data-label="Klant">${esc(customerName(inv.customerId))}</td>
    <td data-label="Datum">${fmtDate(inv.date)}</td>
    <td data-label="Bedrag" class="num">${fmtMoney(total)}</td>
    <td data-label="Status">${statusTagHtml(inv)}</td>
    <td class="rowactions"><button class="btn btn-sm btn-ghost" data-action="view-invoice" data-id="${inv.id}">${ICONS.eye} Bekijk</button></td>
  </tr>`;
}

function customerForm(existing){

  return `
    <div class="modal-head"><h2>${existing?'Klant bewerken':'Nieuwe klant'}</h2><button class="iconbtn" data-close>${ICONS.close}</button></div>
    <div class="modal-body">
      <form id="customerForm">
        <div class="field"><label>Bedrijfs- of klantnaam *</label><input type="text" name="name" required value="${esc(c.name)}"></div>

          <div class="field"><label>E-mailadres</label><input type="email" name="email" value="${esc(c.email)}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Telefoonnummer</label><input type="tel" name="phone" value="${esc(c.phone)}"></div>
          <div class="field"><label>Postcode</label><input type="text" name="postcode" value="${esc(c.postcode)}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Adres</label><input type="text" name="address" value="${esc(c.address)}"></div>
          <div class="field"><label>Plaats</label><input type="text" name="city" value="${esc(c.city)}"></div>
        </div>
        <div class="field"><label>Notities</label><textarea name="notes">${esc(c.notes)}</textarea></div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>Annuleren</button>
      <button class="btn btn-primary" id="saveCustomerBtn">${existing?'Opslaan':'Klant toevoegen'}</button>
    </div>
  `;
}
function openCustomerModal(existing){
  openModal(customerForm(existing));
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
  document.getElementById('saveCustomerBtn').addEventListener('click', async ()=>{
    const form = document.getElementById('customerForm');
    if(!form.reportValidity()) return;
    const data = Object.fromEntries(new FormData(form).entries());
    if(existing){ await updateInCollection('customers', existing.id, data); Object.assign(existing,data); showToast('Klant bijgewerkt'); }
    else { const created = await addToCollection('customers', data); state.customers.push(created); showToast('Klant toegevoegd'); }
    state.customers.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    closeModal(); render();
  });
}

function openFinalizeNumberPicker(forYear, onChosen){
  const availableForYear = state.releasedNumbers.filter(r=>String(r.year)===String(forYear));
  const seq = state.company.nextNumber || 1;
  const previewNumber = `${state.company.invoicePrefix||'FACT'}-${forYear}-${String(seq).padStart(3,'0')}`;
  openModal(`
    <div class="modal-head"><h2>Kies een factuurnummer</h2><button class="iconbtn" data-close>${ICONS.close}</button></div>
    <div class="modal-body">
      <p style="margin:0 0 14px;">Je kunt het volgende nieuwe nummer gebruiken, of gericht een eerder vrijgekomen nummer hergebruiken (van een verwijderde factuur) zodat er geen gaten in de nummering vallen.</p>
      <button type="button" class="btn btn-primary" id="pickNewNumberBtn" style="width:100%;justify-content:space-between;display:flex;margin-bottom:10px;">
        <span>Volgend nieuw nummer</span><strong>${esc(previewNumber)}</strong>
      </button>
      ${availableForYear.length ? `
      <div style="margin:14px 0 6px;font-weight:600;font-size:13px;">Vrijgekomen nummers hergebruiken</div>
      ${availableForYear.map(r=>`<button type="button" class="btn" data-reuse="${r.id}" style="width:100%;justify-content:space-between;display:flex;margin-bottom:8px;"><span>${esc(r.number)}</span><span>↺</span></button>`).join('')}
      ` : ''}
      <div id="finalizeErrorMsg" style="color:var(--danger);font-size:13px;margin-top:10px;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>Annuleren</button>
    </div>
  `);
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
  const errBox = document.getElementById('finalizeErrorMsg');
  const allActionButtons = () => document.querySelectorAll('#pickNewNumberBtn,[data-reuse]');
  const setBusy = (busy)=>{ allActionButtons().forEach(b=>{ b.disabled = busy; b.style.opacity = busy?'0.6':''; }); };
  document.getElementById('pickNewNumberBtn').addEventListener('click', async ()=>{
    setBusy(true); errBox.textContent = '';
    try{
      await updateCompany({nextNumber: seq+1});
      state.company.nextNumber = seq+1;
      await onChosen(previewNumber, seq);
    }catch(err){
      setBusy(false);
      errBox.textContent = 'Er ging iets mis bij het toekennen van het nummer: ' + (err && err.message ? err.message : String(err)) + '. Probeer het nogmaals.';
    }
  });
  document.querySelectorAll('[data-reuse]').forEach(btn=>btn.addEventListener('click', async ()=>{
    setBusy(true); errBox.textContent = '';
    try{
      const rel = byId(state.releasedNumbers, btn.dataset.reuse);
      if(!rel) return;
      await deleteFromCollection('releasedNumbers', rel.id);
      state.releasedNumbers = state.releasedNumbers.filter(r=>r.id!==rel.id);
      const parts = rel.number.split('-');
      const seqPart = parseInt(parts[parts.length-1],10) || 0;
      await onChosen(rel.number, seqPart);
    }catch(err){
      setBusy(false);
      errBox.textContent = 'Er ging iets mis bij het hergebruiken van het nummer: ' + (err && err.message ? err.message : String(err)) + '. Probeer het nogmaals.';
    }
  }));
}
async function releaseInvoiceNumber(inv){
  if(!inv.number) return;
  const year = (inv.date||'').slice(0,4) || String(new Date().getFullYear());
  const created = await addToCollection('releasedNumbers', {number: inv.number, year});
  state.releasedNumbers.push(created);
}

            <td data-label="Nummer"><strong style="color:${inv.isCredit?'var(--danger)':'var(--brand-blue-deep)'}">${esc(displayInvoiceNumber(inv))}</strong></td>
            <td data-label="Klant">${esc(customerName(inv.customerId))}</td>
            <td data-label="Datum">${fmtDate(inv.date)}</td>
            <td data-label="Vervaldatum">${inv.isCredit?'—':fmtDate(inv.dueDate)}</td>

/* ---- invoice line-editor state (used inside new-invoice modal) ---- */
let draftLines = [];
function newLine(){ return {id:uid(), description:'', quantity:1, unit:'stuk', price:0, vat: (state.company.defaultVat!=null?state.company.defaultVat:21), category:'materiaal'}; }
function draftTotalsHtml(){
  const dummy = {lines: draftLines};
  const sub = invoiceTotal(dummy);
  const vatMap = invoiceVatBreakdown(dummy);
  const vatTotal = invoiceVatTotal(dummy);
  const grand = sub + vatTotal;
  return `
    <div class="totalsbox">
      <div class="row"><span>Subtotaal</span><span>${fmtMoney(sub)}</span></div>
      ${Object.keys(vatMap).sort().map(rate=>`<div class="row"><span>BTW ${rate}%</span><span>${fmtMoney(vatMap[rate])}</span></div>`).join('')}
      <div class="row total"><span>Totaal</span><span>${fmtMoney(grand)}</span></div>
    </div>
  `;
}
function linesEditorHtml(){
  return `
    <table class="lines-table">
      <thead><tr><th style="width:38%">Omschrijving</th><th style="width:12%">Aantal</th><th style="width:14%">Eenheid</th><th style="width:16%">Prijs (excl.)</th><th style="width:10%">BTW%</th><th style="width:14%">Bedrag</th><th></th></tr></thead>
      <tbody id="lineRows">
        ${draftLines.map((l,idx)=>lineRowHtml(l,idx)).join('')}
      </tbody>
    </table>
    <button type="button" class="btn btn-sm" id="addLineBtn">${ICONS.plus} Regel toevoegen</button>
  `;
}
function lineRowHtml(l, idx){
  return `<tr data-line-id="${l.id}">
    <td><input type="text" data-field="description" value="${esc(l.description)}" placeholder="Omschrijving"></td>
    <td><input type="number" step="0.01" data-field="quantity" value="${esc(l.quantity)}"></td>
    <td><input type="text" data-field="unit" value="${esc(l.unit)}"></td>
    <td><input type="number" step="0.01" data-field="price" value="${esc(l.price)}"></td>
    <td><input type="number" step="1" data-field="vat" value="${esc(l.vat)}"></td>
    <td class="linetotal">${fmtMoney(lineTotal(l))}</td>
    <td><button type="button" class="iconbtn" data-remove-line="${l.id}">${ICONS.trash}</button></td>
  </tr>`;
}
function refreshLinesTable(){
  document.getElementById('lineRows').innerHTML = draftLines.map((l,idx)=>lineRowHtml(l,idx)).join('');
  document.getElementById('draftTotals').innerHTML = draftTotalsHtml();
  wireLineRowEvents();
}
function wireLineRowEvents(){
  document.querySelectorAll('#lineRows tr').forEach(tr=>{
    const id = tr.dataset.lineId;
    const line = draftLines.find(l=>l.id===id);
    tr.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const field = inp.dataset.field;
        line[field] = (field==='quantity'||field==='price'||field==='vat') ? Number(inp.value)||0 : inp.value;
        tr.querySelector('.linetotal').textContent = fmtMoney(lineTotal(line));
        document.getElementById('draftTotals').innerHTML = draftTotalsHtml();
      });
    });
  });
  document.querySelectorAll('[data-remove-line]').forEach(b=>{
    b.addEventListener('click', ()=>{
      draftLines = draftLines.filter(l=>l.id!==b.dataset.removeLine);
      refreshLinesTable();
    });
  });
}

function openInvoiceModal(preselect){
  preselect = preselect || {};
  draftLines = preselect.projectId ? [] : [newLine()];
  const html = `
    <div class="modal-head"><h2>Nieuwe factuur</h2><button class="iconbtn" data-close>${ICONS.close}</button></div>
    <div class="modal-body">
      <form id="invoiceForm">
        <div class="field-row">
          <div class="field"><label>Klant *</label>
            <select name="customerId" id="invCustomerSelect" required>
              <option value="">Kies een klant…</option>
              ${state.customers.map(c=>`<option value="${c.id}" ${preselect.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Project (optioneel)</label>
            <select name="projectId" id="invProjectSelect"><option value="">Geen project</option></select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Factuurdatum</label><input type="date" name="date" id="invDate" value="${todayStr()}"></div>
          <div class="field"><label>Vervaldatum</label><input type="date" name="dueDate" id="invDueDate" value="${addDays(todayStr(), state.company.paymentTermDays||14)}"></div>
        </div>
        <div id="unbilledWrap"></div>
        <fieldset>
          <legend>Factuurregels</legend>
          <div id="linesEditorWrap">${linesEditorHtml()}</div>
          <div id="draftTotals" style="margin-top:10px;">${draftTotalsHtml()}</div>
        </fieldset>
        <div class="field"><label>Notities op factuur (optioneel)</label><textarea name="notes" placeholder="Bijv. projectomschrijving of bedankje"></textarea></div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>Annuleren</button>
      <button class="btn" id="saveConceptBtn">Opslaan als concept</button>
      <button class="btn btn-primary" id="saveSendBtn">Opslaan &amp; markeer verzonden</button>
    </div>
  `;
  openModal(html, true);
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
  wireLineRowEvents();
  document.getElementById('addLineBtn').addEventListener('click', ()=>{ draftLines.push(newLine()); refreshLinesTable(); });

  function refreshProjectOptions(){
    const custId = document.getElementById('invCustomerSelect').value;
    const projSel = document.getElementById('invProjectSelect');
    const projs = state.projects.filter(p=>p.customerId===custId);
    projSel.innerHTML = '<option value="">Geen project</option>' + projs.map(p=>`<option value="${p.id}" ${preselect.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
    refreshUnbilled();
  }
  function refreshUnbilled(){
    const custId = document.getElementById('invCustomerSelect').value;
    const projId = document.getElementById('invProjectSelect').value;
    const wrap = document.getElementById('unbilledWrap');
    if(!custId){ wrap.innerHTML=''; return; }
    const unbilledHours = projId ? unbilledHoursForProject(projId) : unbilledHoursForCustomer(custId);
    const unbilledCosts = projId ? unbilledCostsForProject(projId) : unbilledCostsForCustomer(custId);
    const unbilledKms = projId ? unbilledKmsForProject(projId) : unbilledKmsForCustomer(custId);
    if(unbilledHours.length===0 && unbilledCosts.length===0 && unbilledKms.length===0){ wrap.innerHTML=''; return; }
    const projLabel = item => { const p = byId(state.projects, item.projectId); return p ? ` <span style="color:var(--ink-soft);font-size:12px;">(${esc(p.name)})</span>` : ''; };
    wrap.innerHTML = `
      ${!projId && (unbilledHours.length||unbilledCosts.length||unbilledKms.length) ? `<p class="hint" style="margin-top:0;">Er is geen specifiek project gekozen — hieronder staat alles wat nog openstaat voor deze klant, over al zijn projecten heen.</p>` : ''}
      ${unbilledHours.length? `
      <div class="field"><label>Openstaande uren</label></div>
      <div class="unbilled-list">
        ${unbilledHours.map(h=>`<label><input type="checkbox" data-hour-id="${h.id}"> <span style="flex:1">${fmtDate(h.date)} — ${esc(h.description)||'Werkzaamheden'}${h.useFixedAmount?' (vast bedrag)':''}${projLabel(h)}</span> <span>${h.useFixedAmount?fmtMoney(h.fixedAmount):fmtNum(h.hours,2)+' u'}</span></label>`).join('')}
      </div>
      <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin:6px 0;"><input type="checkbox" id="combineHoursCheck"> <span>Samenvoegen tot één regel (anders: elke dag een aparte regel)</span></label>
      <button type="button" class="btn btn-sm" id="importHoursBtn">Geselecteerde uren toevoegen</button>
      ` : ''}
      ${unbilledCosts.length? `
      <div class="field" style="margin-top:14px;"><label>Openstaande kosten</label></div>
      <div class="unbilled-list">
        ${unbilledCosts.map(c=>`<label><input type="checkbox" data-cost-id="${c.id}"> <span style="flex:1">${fmtDate(c.date)} — ${esc(c.description)||'Kosten'}${projLabel(c)}</span> <span>${fmtMoney(c.amount)}</span></label>`).join('')}
      </div>
      <button type="button" class="btn btn-sm" id="importCostsBtn">Geselecteerde kosten toevoegen</button>
      ` : ''}
      ${unbilledKms.length? `
      <div class="field" style="margin-top:14px;"><label>Openstaande kilometers</label></div>
      <div class="unbilled-list">
        ${unbilledKms.map(k=>`<label><input type="checkbox" data-km-id="${k.id}"> <span style="flex:1">${fmtDate(k.date)} — ${esc(k.description)||'Kilometers'}${k.useFixedAmount?' (vast bedrag)':' ('+fmtNum(k.km,0)+' km)'}${projLabel(k)}</span> <span>${fmtMoney(kmAmount(k))}</span></label>`).join('')}
      </div>
      <button type="button" class="btn btn-sm" id="importKmsBtn">Geselecteerde kilometers toevoegen</button>
      ` : ''}
    `;
    const importHoursBtn = document.getElementById('importHoursBtn');
    if(importHoursBtn) importHoursBtn.addEventListener('click', ()=>{
      const checked = Array.from(wrap.querySelectorAll('input[data-hour-id]:checked')).map(c=>c.dataset.hourId);
      if(checked.length===0){ showToast('Selecteer eerst uren'); return; }
      const combine = document.getElementById('combineHoursCheck').checked;
      const rateFor = h => { if(h.rate) return Number(h.rate); const p = byId(state.projects, h.projectId); return p && p.hourlyRate ? p.hourlyRate : 0; };
      if(combine){
        const normalIds = checked.filter(id=>!byId(state.hours,id).useFixedAmount);
        const fixedIds = checked.filter(id=>byId(state.hours,id).useFixedAmount);
        if(normalIds.length){
          const firstHour = byId(state.hours, normalIds[0]);
          const proj = byId(state.projects, firstHour.projectId);
          const rate = firstHour.rate ? Number(firstHour.rate) : (proj && proj.hourlyRate ? proj.hourlyRate : 0);
          const totalHours = normalIds.reduce((s,id)=> s + Number(byId(state.hours,id).hours||0), 0);
          const vat = byId(state.hours, normalIds[0]).vat;
          draftLines.push({id:uid(), description: `Werkzaamheden ${proj?proj.name:''}`.trim(), quantity: totalHours, unit:'uur', price: rate, vat: vat!=null?vat:((state.company.defaultVat!=null?state.company.defaultVat:21)), category:'uren', _hourIds: normalIds});
        }
        fixedIds.forEach(id=>{
          const h = byId(state.hours, id);
          draftLines.push({id:uid(), description: `${fmtDate(h.date)} — ${h.description||'Werkzaamheden'}`.trim(), quantity:1, unit:'vast', price: h.fixedAmount, vat: h.vat!=null?h.vat:((state.company.defaultVat!=null?state.company.defaultVat:21)), category:'uren', _hourIds:[id]});
        });
      } else {
        checked.forEach(id=>{
          const h = byId(state.hours, id);
          const rate = rateFor(h);
          const proj = byId(state.projects, h.projectId);
          if(h.useFixedAmount){
            draftLines.push({id:uid(), description: `${fmtDate(h.date)} — ${h.description||'Werkzaamheden'}`.trim(), quantity:1, unit:'vast', price: h.fixedAmount, vat: h.vat!=null?h.vat:((state.company.defaultVat!=null?state.company.defaultVat:21)), category:'uren', _hourIds:[id]});
          } else {
            draftLines.push({id:uid(), description: `${fmtDate(h.date)} — ${h.description || ('Werkzaamheden '+(proj?proj.name:''))}`.trim(), quantity: h.hours, unit:'uur', price: rate, vat: h.vat!=null?h.vat:((state.company.defaultVat!=null?state.company.defaultVat:21)), category:'uren', _hourIds:[id]});
          }
        });
      }
      refreshLinesTable();
      showToast(combine ? 'Uren toegevoegd als één regel' : 'Uren toegevoegd, per dag een regel');
    });
    const importCostsBtn = document.getElementById('importCostsBtn');
    if(importCostsBtn) importCostsBtn.addEventListener('click', ()=>{
      const checked = Array.from(wrap.querySelectorAll('input[data-cost-id]:checked')).map(c=>c.dataset.costId);
      if(checked.length===0){ showToast('Selecteer eerst kosten'); return; }
      checked.forEach(id=>{
        const c = byId(state.costs, id);
        draftLines.push({id:uid(), description: `${fmtDate(c.date)} — ${c.description||'Kosten'}`.trim(), quantity:1, unit:'stuk', price: c.amount, vat: c.vat!=null?c.vat:((state.company.defaultVat!=null?state.company.defaultVat:21)), category:'materiaal', _costIds:[id]});
      });
      refreshLinesTable();
      showToast('Kosten toegevoegd als regel');
    });
    const importKmsBtn = document.getElementById('importKmsBtn');
    if(importKmsBtn) importKmsBtn.addEventListener('click', ()=>{
      const checked = Array.from(wrap.querySelectorAll('input[data-km-id]:checked')).map(c=>c.dataset.kmId);
      if(checked.length===0){ showToast('Selecteer eerst kilometers'); return; }
      checked.forEach(id=>{
        const k = byId(state.kms, id);
        if(k.useFixedAmount){
          draftLines.push({id:uid(), description: `${fmtDate(k.date)} — ${k.description||'Kilometervergoeding'}`.trim(), quantity:1, unit:'vast', price: k.fixedAmount, vat: k.vat!=null?k.vat:((state.company.defaultVat!=null?state.company.defaultVat:21)), category:'km', _kmIds:[id]});
        } else {
          draftLines.push({id:uid(), description: `${fmtDate(k.date)} — ${k.description||'Kilometervergoeding'}`.trim(), quantity: k.km, unit:'km', price: k.rate, vat: k.vat!=null?k.vat:((state.company.defaultVat!=null?state.company.defaultVat:21)), category:'km', _kmIds:[id]});
        }
      });
      refreshLinesTable();
      showToast('Kilometers toegevoegd als regel');
    });
    if(preselect.autoImportAll && (!preselect.projectId || projId===preselect.projectId)){
      wrap.querySelectorAll('input[type=checkbox][data-hour-id],input[type=checkbox][data-cost-id],input[type=checkbox][data-km-id]').forEach(cb=>cb.checked=true);
      if(importHoursBtn) importHoursBtn.click();
      if(importCostsBtn) importCostsBtn.click();
      if(importKmsBtn) importKmsBtn.click();
      preselect.autoImportAll = false;
    }
  }
  document.getElementById('invCustomerSelect').addEventListener('change', refreshProjectOptions);
  document.getElementById('invProjectSelect').addEventListener('change', refreshUnbilled);
  if(preselect.customerId){ refreshProjectOptions(); }

  async function doSave(markSent){
    const form = document.getElementById('invoiceForm');
    if(!form.reportValidity()) return;
    if(draftLines.length===0 || draftLines.every(l=>!l.description)){ showToast('Voeg minstens één factuurregel toe'); return; }
    const fd = Object.fromEntries(new FormData(form).entries());
    const billedHourIds = [];
    draftLines.forEach(l=>{ if(l._hourIds) billedHourIds.push(...l._hourIds); });
    const billedCostIds = [];
    draftLines.forEach(l=>{ if(l._costIds) billedCostIds.push(...l._costIds); });
    const billedKmIds = [];
    draftLines.forEach(l=>{ if(l._kmIds) billedKmIds.push(...l._kmIds); });
    const linesToSave = draftLines.filter(l=>l.description).map(l=>({description:l.description,quantity:l.quantity,unit:l.unit,price:l.price,vat:l.vat,category:l.category||'materiaal'}));
    const finishSave = async (number, sequenceNumber, status)=>{
      const invoiceData = {
        number: number||null, sequenceNumber: sequenceNumber||null,
        date: fd.date, dueDate: fd.dueDate,
        customerId: fd.customerId, projectId: fd.projectId||null,
        lines: linesToSave,
        notes: fd.notes||'', status,
        isCredit:false, creditForNumber:null, billedHourIds, billedCostIds, billedKmIds, showCustomerNotes:true,
        createdAt: nowIso()
      };
      const created = await addToCollection('invoices', invoiceData);
      state.invoices.unshift(created);
      for(const hid of billedHourIds){
        await updateInCollection('hours', hid, {billed:true, invoiceId: created.id});
        const h = byId(state.hours, hid); if(h){ h.billed=true; h.invoiceId=created.id; }
      }
      for(const cid of billedCostIds){
        await updateInCollection('costs', cid, {billed:true, invoiceId: created.id});
        const c = byId(state.costs, cid); if(c){ c.billed=true; c.invoiceId=created.id; }
      }
      for(const kid of billedKmIds){
        await updateInCollection('kms', kid, {billed:true, invoiceId: created.id});
        const k = byId(state.kms, kid); if(k){ k.billed=true; k.invoiceId=created.id; }
      }
      closeModal();
      showToast(markSent? `Factuur ${number} aangemaakt en verzonden` : 'Concept opgeslagen (nog geen factuurnummer)');
      setView('facturen');
      openInvoiceDetail(created.id);
    };
    if(markSent){
      const year = new Date(fd.date).getFullYear();
      openFinalizeNumberPicker(year, (number, seq)=>finishSave(number, seq, 'verzonden'));
    } else {
      await finishSave(null, null, 'concept');
    }
  }
  document.getElementById('saveConceptBtn').addEventListener('click', ()=>doSave(false));
  document.getElementById('saveSendBtn').addEventListener('click', ()=>doSave(true));
}

  const status = invoiceDisplayStatus(inv);
  openModal(`
    <div class="modal-head">
      <h2>${inv.isCredit?'Creditfactuur':(inv.number?'Factuur':'Conceptfactuur')} ${esc(displayInvoiceNumber(inv))} ${statusTagHtml(inv)}</h2>

      ${!inv.isCredit && inv.number && (inv.status==='verzonden') ? `<button class="btn" id="markPaidBtn">${ICONS.check} Markeer als betaald</button>`:''}
      ${!inv.isCredit && inv.number ? `<button class="btn" id="creditBtn">${ICONS.reverse} Creditfactuur maken</button>`:''}
      <button class="btn btn-danger" id="deleteInvBtn">${ICONS.trash} Verwijderen</button>

      <button class="btn" data-close>Sluiten</button>

  const downloadBtn = document.getElementById('downloadPdfBtn');
  if(downloadBtn) downloadBtn.addEventListener('click', ()=>downloadInvoicePdf(inv));
  if(inv.number && cust.email){
    document.getElementById('mailBtn').addEventListener('click', ()=>showMailInstructions(inv, cust));
  }
  const finalizeBtn = document.getElementById('finalizeBtn');
  if(finalizeBtn) finalizeBtn.addEventListener('click', ()=>{
    const year = new Date(inv.date).getFullYear();
    openFinalizeNumberPicker(year, async (number, seq)=>{
      await updateInCollection('invoices', inv.id, {number, sequenceNumber: seq, status:'verzonden'});
      inv.number = number; inv.sequenceNumber = seq; inv.status = 'verzonden';
      closeModal();
      showToast(`Factuur is definitief: ${number}`);
      render();
      openInvoiceDetail(inv.id);
    });
  });
  const markSentBtn = document.getElementById('markSentBtn');
  if(markSentBtn) markSentBtn.addEventListener('click', async ()=>{
    await updateInCollection('invoices', inv.id, {status:'verzonden'}); inv.status='verzonden';
    showToast('Factuur gemarkeerd als verzonden'); closeModal(); render();
  });
  const markPaidBtn = document.getElementById('markPaidBtn');
  if(markPaidBtn) markPaidBtn.addEventListener('click', async ()=>{
    await updateInCollection('invoices', inv.id, {status:'betaald'}); inv.status='betaald';
    showToast('Factuur gemarkeerd als betaald'); closeModal(); render();
  });
  const creditBtn = document.getElementById('creditBtn');
  if(creditBtn) creditBtn.addEventListener('click', ()=>{ closeModal(); createCreditNote(inv); });
  const deleteInvBtn = document.getElementById('deleteInvBtn');
  if(deleteInvBtn) deleteInvBtn.addEventListener('click', ()=>{
    confirmDialog(inv.number?'Factuur verwijderen?':'Concept verwijderen?', inv.number? `Weet je zeker dat je factuur ${esc(inv.number)} wilt verwijderen? Het nummer komt vrij om later te hergebruiken, en de uren/kosten/km worden weer open gezet.` : `Weet je zeker dat je dit concept wilt verwijderen?`, 'Verwijderen', async ()=>{
      if(inv.number) await releaseInvoiceNumber(inv);
      await deleteFromCollection('invoices', inv.id);
      state.invoices = state.invoices.filter(i=>i.id!==inv.id);
      for(const hid of (inv.billedHourIds||[])){
        await updateInCollection('hours', hid, {billed:false, invoiceId:null});
        const h = byId(state.hours, hid); if(h){ h.billed=false; h.invoiceId=null; }
      }
      for(const cid of (inv.billedCostIds||[])){
        await updateInCollection('costs', cid, {billed:false, invoiceId:null});
        const c = byId(state.costs, cid); if(c){ c.billed=false; c.invoiceId=null; }
      }
      for(const kid of (inv.billedKmIds||[])){
        await updateInCollection('kms', kid, {billed:false, invoiceId:null});
        const k = byId(state.kms, kid); if(k){ k.billed=false; k.invoiceId=null; }
      }
      closeModal();
      showToast(inv.number ? 'Factuur verwijderd, nummer vrijgegeven' : 'Concept verwijderd'); render();
    });
  });
}

async function createCreditNote(original){
  const seq = state.company.nextNumber || 1;
  const number = `${state.company.invoicePrefix||'FACT'}-${new Date().getFullYear()}-${String(seq).padStart(3,'0')}`;
  const data = {
    number, sequenceNumber: seq,
    date: todayStr(), dueDate: null,
    customerId: original.customerId, projectId: original.projectId||null,
    lines: (original.lines||[]).map(l=>Object.assign({},l)),
    notes: original.notes||'', status:'verzonden',
    isCredit:true, creditForNumber: original.number, billedHourIds:[], billedCostIds:[], billedKmIds:[],
    createdAt: nowIso()
  };
  const created = await addToCollection('invoices', data);
  state.invoices.unshift(created);
  await updateCompany({nextNumber: seq+1});
  state.company.nextNumber = seq+1;
  showToast('Creditfactuur aangemaakt');
  render();
  openInvoiceDetail(created.id);
}

/* ---- PDF generation ---- */
function buildInvoicePdf(inv){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const company = state.company;
  const cust = byId(state.customers, inv.customerId) || {};
  const pageW = 210, marginX = 20;
  let y = 20;

  try{ doc.addImage(LOGO_DATA_URI_PDF, 'PNG', marginX, y-4, 84, 84*(337/1228)); }catch(e){}

  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(60,60,60);
  const compLines = [company.name];
  if(company.address) compLines.push(company.address);
  if(company.postcode||company.city) compLines.push(`${company.postcode||''} ${company.city||''}`.trim());
  if(company.kvk) compLines.push(`KvK ${company.kvk}`);
  if(company.btwNummer) compLines.push(`BTW ${company.btwNummer}`);
  if(company.email) compLines.push(company.email);
  if(company.phone) compLines.push(company.phone);
  doc.setFont('helvetica','bold'); doc.setTextColor(20,20,20);
  doc.text(company.name||'', pageW-marginX, y, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setTextColor(70,70,70);
  let cy = y+5;
  compLines.slice(1).forEach(line=>{ doc.text(line, pageW-marginX, cy, {align:'right'}); cy+=4.3; });

  y = 46;
  doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.setTextColor(...(inv.isCredit?[179,72,72]:[60,95,143]));
  doc.text(`${inv.isCredit?'Creditfactuur':'Factuur'} ${displayInvoiceNumber(inv)}`, marginX, y);
  y+=7;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(90,90,90);
  let metaLine = `Datum: ${fmtDate(inv.date)}`;
  if(!inv.isCredit) metaLine += `    Vervaldatum: ${fmtDate(inv.dueDate)}`;
  doc.text(metaLine, marginX, y);
  if(inv.creditForNumber){ y+=5; doc.text(`Creditering van factuur ${inv.creditForNumber}`, marginX, y); }
  y+=10;

  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(140,140,140);
  doc.text('AAN', marginX, y); y+=5;
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(20,20,20);
  doc.text(cust.name||'', marginX, y); y+=5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(70,70,70);
  if(cust.contactName){ doc.text(`t.a.v. ${cust.contactName}`, marginX, y); y+=4.3; }
  if(cust.address){ doc.text(cust.address, marginX, y); y+=4.3; }
  if(cust.postcode||cust.city){ doc.text(`${cust.postcode||''} ${cust.city||''}`.trim(), marginX, y); y+=4.3; }
  y+=8;

  const colX = {desc:marginX, qty:108, unit:113, price:150, vat:172, total:190};
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(30,30,30);
  doc.text('OMSCHRIJVING', colX.desc, y);
  doc.text('AANTAL', colX.qty, y, {align:'right'});
  doc.text('EENH.', colX.unit, y);
  doc.text('PRIJS', colX.price, y, {align:'right'});
  doc.text('BTW', colX.vat, y, {align:'right'});
  doc.text('BEDRAG', colX.total, y, {align:'right'});
  y+=2.5;
  doc.setDrawColor(30,30,30); doc.setLineWidth(0.4);
  doc.line(marginX, y, pageW-marginX, y);
  y+=6;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(30,30,30);
  (inv.lines||[]).forEach(l=>{
    const descLines = doc.splitTextToSize(l.description||'', 78);
    const rowH = Math.max(descLines.length*4.3, 5);
    if(y + rowH > 268){ doc.addPage(); y = 22; }
    doc.text(descLines, colX.desc, y);
    doc.text(fmtNum(l.quantity,2), colX.qty, y, {align:'right'});
    doc.text(String(l.unit||''), colX.unit, y);
    doc.text(fmtMoney(l.price), colX.price, y, {align:'right'});
    doc.text(`${l.vat}%`, colX.vat, y, {align:'right'});
    doc.text(fmtMoney(lineTotal(l)), colX.total, y, {align:'right'});
    y += rowH + 4.5;
  });

  y += 4;
  const vatMap = invoiceVatBreakdown(inv);
  const totalsX1 = 140, totalsX2 = 190;
  function totalRow(label, value, bold){
    doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(bold?11:9.5);
    doc.setTextColor(bold?20:80, bold?20:80, bold?20:80);
    doc.text(label, totalsX1, y);
    doc.text(value, totalsX2, y, {align:'right'});
    y += bold? 7 : 5.2;
  }
  if(y>250){ doc.addPage(); y=22; }
  totalRow('Subtotaal', fmtMoney(invoiceTotal(inv)), false);
  Object.keys(vatMap).sort().forEach(rate=> totalRow(`BTW ${rate}%`, fmtMoney(vatMap[rate]), false));
  y += 2.5;
  doc.setDrawColor(30,30,30); doc.setLineWidth(0.3); doc.line(totalsX1, y, totalsX2, y);
  y += 5.5;
  totalRow('Totaal', fmtMoney(invoiceGrandTotal(inv)), true);

  y += 10;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(120,120,120);
  const footerParts = [];
  if(company.iban) footerParts.push(`IBAN ${company.iban}${company.ibanName? ' t.n.v. '+company.ibanName:''}`);
  if(company.footerNote) footerParts.push(company.footerNote);
  const footerText = footerParts.join('\n');
  if(footerText){
    if(y>270){ doc.addPage(); y=22; }
    doc.setDrawColor(225,225,225); doc.line(marginX, y-4, pageW-marginX, y-4);
    doc.text(doc.splitTextToSize(footerText, 170), marginX, y);
  }
  return doc;
}
function waitForJsPdf(timeoutMs){
  return new Promise((resolve)=>{
    const start = Date.now();
    (function check(){
      if(window.jspdf && window.jspdf.jsPDF){ resolve(true); return; }
      if(Date.now()-start > timeoutMs){ resolve(false); return; }
      setTimeout(check, 100);
    })();
  });
}

    const fullHtml = `<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><title>${esc(displayInvoiceNumber(inv))}</title><style>${invoiceCss}</style></head><body><div class="invoice-doc">${invoiceDocHtml(inv)}</div></body></html>`;
    const blob = new Blob([fullHtml], {type:'text/html'});
    const filename = `${displayInvoiceNumber(inv).replace(/[^a-zA-Z0-9-]/g,'_')}.html`;
    showToast('PDF-bibliotheek niet beschikbaar — factuur wordt als HTML-bestand aangeboden.');
    offerDownload(filename, blob);
  }catch(err){
    showToast('Bestand maken mislukt: ' + (err && err.message ? err.message : String(err)));
    console.error('Invoice file build error:', err);

}
async function offerDownload(filename, blob){
  let downloads = null;
  try{ downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }catch(e){ downloads = null; }
  if(downloads){
    try{
      await downloads.save({filename, data: blob});
      showToast('PDF opgeslagen');
    }catch(err){
      if(err && err.code === 'declined'){ /* user cancelled, no message needed */ }
      else { showToast('Downloaden mislukt: ' + (err && err.message ? err.message : 'onbekende fout')); }
    }
    return;
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ showToast('Downloaden lukte niet in deze weergave'); }
}

`Beste ${cust.contactName||cust.name||''},

Hierbij ontvang je ${inv.isCredit?'creditfactuur':'factuur'} ${displayInvoiceNumber(inv)} ter waarde van ${fmtMoney(inv.isCredit?-invoiceGrandTotal(inv):invoiceGrandTotal(inv))}.

Met vriendelijke groet,
${state.company.name}`
  );
  return `mailto:${cust.email}?subject=${subject}&body=${body}`;
}
