function wireInstellingen(){
  const saveBtn = document.getElementById('saveSettingsBtn');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const form = document.getElementById('settingsForm');
    const data = Object.fromEntries(new FormData(form).entries());
    data.defaultVat = Number(data.defaultVat)||0;
    data.paymentTermDays = Number(data.paymentTermDays)||0;
    await updateCompany(data);
    Object.assign(state.company, data);
    showToast('Instellingen opgeslagen');
    renderNav();
  });
  const prefixBtn = document.getElementById('savePrefixBtn');
  if(prefixBtn) prefixBtn.addEventListener('click', async ()=>{
    const val = document.getElementById('prefixInput').value.trim() || 'FACT';
    await updateCompany({invoicePrefix: val});
    state.company.invoicePrefix = val;
    showToast('Prefix opgeslagen');
    render();
  });
  const nextNumberBtn = document.getElementById('saveNextNumberBtn');
  if(nextNumberBtn) nextNumberBtn.addEventListener('click', async ()=>{
    const val = Math.max(1, parseInt(document.getElementById('nextNumberInput').value, 10) || 1);
    await updateCompany({nextNumber: val});
    state.company.nextNumber = val;
    showToast('Volgnummer opgeslagen');
    render();
  });
  const wipeBtn = document.getElementById('wipeDataBtn');
  if(wipeBtn) wipeBtn.addEventListener('click', ()=>{
    confirmDialog(
      'Alles wissen?',
      'Dit verwijdert ALLE klanten, projecten, uren, kosten, kilometers en facturen definitief. Dit kan niet ongedaan gemaakt worden. Bedrijfsgegevens en het wachtwoord blijven staan.',
      'Ja, alles wissen',
      async ()=>{
        for(const c of [...state.customers]) await deleteFromCollection('customers', c.id);
        for(const p of [...state.projects]) await deleteFromCollection('projects', p.id);
        for(const h of [...state.hours]) await deleteFromCollection('hours', h.id);
        for(const co of [...state.costs]) await deleteFromCollection('costs', co.id);
        for(const k of [...state.kms]) await deleteFromCollection('kms', k.id);
        for(const i of [...state.invoices]) await deleteFromCollection('invoices', i.id);
        for(const r of [...state.releasedNumbers]) await deleteFromCollection('releasedNumbers', r.id);
        state.customers = []; state.projects = []; state.hours = []; state.costs = []; state.kms = []; state.invoices = []; state.releasedNumbers = [];
        showToast('Alle gegevens zijn gewist');
        setView('instellingen');
      }
    );
  });
}

/* ================= render dispatcher & global actions ================= */
function render(){
  const content = document.getElementById('content');
  if(!state.ready){ content.innerHTML = `<div class="emptystate">Bezig met laden…</div>`; return; }
  let html = '';
  if(state.view==='dashboard') html = renderDashboard();
  else if(state.view==='klanten') html = renderKlanten();
  else if(state.view==='projecten') html = renderProjecten();
  else if(state.view==='uren') html = renderUren();
  else if(state.view==='facturen') html = renderFacturen();
  else if(state.view==='instellingen') html = renderInstellingen();
  content.innerHTML = html;
  wireContentEvents();
  if(state.view==='instellingen') wireInstellingen();
}

function wireContentEvents(){
  document.querySelectorAll('[data-view]').forEach(el=>{
    el.addEventListener('click', ()=> setView(el.dataset.view));
  });
  document.querySelectorAll('[data-action="new-customer"]').forEach(el=>el.addEventListener('click', ()=>openCustomerModal(null)));
  document.querySelectorAll('[data-action="edit-customer"]').forEach(el=>el.addEventListener('click', ()=>openCustomerModal(byId(state.customers, el.dataset.id))));
  document.querySelectorAll('[data-action="delete-customer"]').forEach(el=>el.addEventListener('click', ()=>{
    const c = byId(state.customers, el.dataset.id);
    const linked = state.projects.some(p=>p.customerId===c.id) || state.invoices.some(i=>i.customerId===c.id);
    if(linked){ showToast('Kan klant niet verwijderen: nog gekoppeld aan projecten of facturen'); return; }
    confirmDialog('Klant verwijderen?', `Weet je zeker dat je ${esc(c.name)} wilt verwijderen?`, 'Verwijderen', async ()=>{
      await deleteFromCollection('customers', c.id);
      state.customers = state.customers.filter(x=>x.id!==c.id);
      showToast('Klant verwijderd'); render();
    });
  }));
  document.querySelectorAll('[data-action="new-project"]').forEach(el=>el.addEventListener('click', ()=>openProjectModal(null)));
  document.querySelectorAll('[data-action="edit-project"]').forEach(el=>el.addEventListener('click', ()=>openProjectModal(byId(state.projects, el.dataset.id))));
  document.querySelectorAll('[data-action="delete-project"]').forEach(el=>el.addEventListener('click', ()=>{
    const p = byId(state.projects, el.dataset.id);
    const hasHours = state.hours.some(h=>h.projectId===p.id);
    const hasCosts = state.costs.some(c=>c.projectId===p.id);
    const hasKms = state.kms.some(k=>k.projectId===p.id);
    const hasInvoices = state.invoices.some(i=>i.projectId===p.id);
    if(hasHours || hasCosts || hasKms || hasInvoices){
      const parts = [];
      if(hasHours) parts.push('uren');
      if(hasCosts) parts.push('kosten');
      if(hasKms) parts.push('kilometers');
      if(hasInvoices) parts.push('facturen');
      showToast(`Kan project niet verwijderen: nog gekoppeld aan ${parts.join(', ')}`);
      return;
    }
    confirmDialog('Project verwijderen?', `Weet je zeker dat je ${esc(p.name)} wilt verwijderen?`, 'Verwijderen', async ()=>{
      await deleteFromCollection('projects', p.id);
      state.projects = state.projects.filter(x=>x.id!==p.id);
      showToast('Project verwijderd'); render();
    });
  }));
  document.querySelectorAll('[data-action="new-hour"]').forEach(el=>el.addEventListener('click', ()=>openHourModal(null)));
  const urenProjectFilterSelect = document.getElementById('urenProjectFilterSelect');
  if(urenProjectFilterSelect) urenProjectFilterSelect.addEventListener('change', (e)=>{ urenProjectFilter = e.target.value; render(); });
  const urenShowBilledCheck = document.getElementById('urenShowBilledCheck');
  if(urenShowBilledCheck) urenShowBilledCheck.addEventListener('change', (e)=>{ urenShowBilled = e.target.checked; render(); });
  document.querySelectorAll('[data-action="edit-hour"]').forEach(el=>el.addEventListener('click', ()=>openHourModal(byId(state.hours, el.dataset.id))));
  document.querySelectorAll('[data-action="delete-hour"]').forEach(el=>el.addEventListener('click', ()=>{
    const h = byId(state.hours, el.dataset.id);
    confirmDialog('Uren verwijderen?', `Deze registratie van ${fmtNum(h.hours,2)} uur wordt verwijderd.`, 'Verwijderen', async ()=>{
      await deleteFromCollection('hours', h.id);
      state.hours = state.hours.filter(x=>x.id!==h.id);
      showToast('Uren verwijderd'); render();
    });
  }));
  document.querySelectorAll('[data-action="new-cost"]').forEach(el=>el.addEventListener('click', ()=>openCostModal(null)));
  document.querySelectorAll('[data-action="edit-cost"]').forEach(el=>el.addEventListener('click', ()=>openCostModal(byId(state.costs, el.dataset.id))));
  document.querySelectorAll('[data-action="delete-cost"]').forEach(el=>el.addEventListener('click', ()=>{
    const c = byId(state.costs, el.dataset.id);
    confirmDialog('Kosten verwijderen?', `Deze kostenregel (${fmtMoney(c.amount)}) wordt verwijderd.`, 'Verwijderen', async ()=>{
      await deleteFromCollection('costs', c.id);
      state.costs = state.costs.filter(x=>x.id!==c.id);
      showToast('Kosten verwijderd'); render();
    });
  }));
  document.querySelectorAll('[data-action="new-km"]').forEach(el=>el.addEventListener('click', ()=>openKmModal(null)));
  document.querySelectorAll('[data-action="edit-km"]').forEach(el=>el.addEventListener('click', ()=>openKmModal(byId(state.kms, el.dataset.id))));
  document.querySelectorAll('[data-action="delete-km"]').forEach(el=>el.addEventListener('click', ()=>{
    const k = byId(state.kms, el.dataset.id);
    confirmDialog('Kilometers verwijderen?', `Deze registratie (${fmtMoney(kmAmount(k))}) wordt verwijderd.`, 'Verwijderen', async ()=>{
      await deleteFromCollection('kms', k.id);
      state.kms = state.kms.filter(x=>x.id!==k.id);
      showToast('Kilometers verwijderd'); render();
    });
  }));
  document.querySelectorAll('[data-action="new-invoice"]').forEach(el=>el.addEventListener('click', ()=>openInvoiceModal()));
  document.querySelectorAll('[data-action="quick-invoice"]').forEach(el=>el.addEventListener('click', ()=>{
    const p = byId(state.projects, el.dataset.id);
    if(!p) return;
    const hasHours = unbilledHoursForProject(p.id).length>0;
    const hasCosts = unbilledCostsForProject(p.id).length>0;
    const hasKms = unbilledKmsForProject(p.id).length>0;
    if(!hasHours && !hasCosts && !hasKms){ showToast('Niets te factureren voor dit project'); return; }
    openInvoiceModal({customerId: p.customerId, projectId: p.id, autoImportAll:true});
  }));
  document.querySelectorAll('[data-action="view-invoice"]').forEach(el=>el.addEventListener('click', ()=>openInvoiceDetail(el.dataset.id)));
  document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click', ()=>{ invoiceFilter = el.dataset.filter; render(); }));
}

/* ---------------- boot ---------------- */
async function boot(){
  renderNav();
  render();
  await initBackend();
  if(!useDb){ state.storageWarning = true; }
  await loadAll();
  renderNav();
  render();
}

/* ---------------- login gate (Firebase Authentication) ---------------- */
const LAST_ACTIVITY_KEY = LS_PREFIX + "lastActivity";
const IDLE_TIMEOUT_MS = 15 * 60 * 1000; // 15 minuten
const gateEl = document.getElementById('loginGate');
const appRootEl = document.getElementById('appRoot');
const gateEmailInput = document.getElementById('loginGateEmail');
const gateInput = document.getElementById('loginGateInput');
const gateBtn = document.getElementById('loginGateBtn');
const gateError = document.getElementById('loginGateError');
document.getElementById('loginGateLogo').src = LOGO_DATA_URI;

initFirebase();

function markActivity(){
  try{ localStorage.setItem(LAST_ACTIVITY_KEY, String(Date.now())); }catch(e){}
}
function lockApp(){
  gateEl.classList.remove('hidden');
  appRootEl.classList.remove('unlocked');
  gateInput.value = '';
  gateError.textContent = '';
  closeDrawer();
  document.getElementById('modalOverlay').classList.add('hidden');
  if(fbAuth && fbAuth.currentUser){ fbAuth.signOut().catch(()=>{}); }
  setTimeout(()=>gateEmailInput.focus(), 50);
}
function unlockApp(){
  gateEl.classList.add('hidden');
  appRootEl.classList.add('unlocked');
  markActivity();
  boot();
}
function authErrorMessage(err){
  const code = err && err.code || '';
  if(code.includes('wrong-password') || code.includes('invalid-credential') || code.includes('invalid-login-credentials')) return 'Onjuist e-mailadres of wachtwoord.';
  if(code.includes('user-not-found')) return 'Onbekend e-mailadres.';
  if(code.includes('invalid-email')) return 'Vul een geldig e-mailadres in.';
  if(code.includes('too-many-requests')) return 'Te veel pogingen, probeer het over een paar minuten opnieuw.';
  if(code.includes('network-request-failed')) return 'Geen verbinding — check je internet.';
  return 'Inloggen mislukt: ' + (err && err.message ? err.message : 'onbekende fout');
}
function tryUnlock(){
  if(!fbAuth){ gateError.textContent = 'Inloggen is nu niet beschikbaar, probeer het later opnieuw.'; return; }
  const email = (gateEmailInput.value||'').trim();
  const pwd = gateInput.value;
  if(!email || !pwd){ gateError.textContent = 'Vul e-mailadres en wachtwoord in.'; return; }
  gateBtn.disabled = true; gateError.textContent = '';
  fbAuth.signInWithEmailAndPassword(email, pwd)
    .then(()=>{ gateBtn.disabled = false; })
    .catch(err=>{
      gateBtn.disabled = false;
      gateError.textContent = authErrorMessage(err);
      gateInput.value = '';
      gateInput.focus();
    });
}
gateBtn.addEventListener('click', tryUnlock);
gateInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryUnlock(); });
gateEmailInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') gateInput.focus(); });

const logoutDesktopBtn = document.getElementById('logoutBtnDesktop');
const logoutMobileBtn = document.getElementById('logoutBtnMobile');
if(logoutDesktopBtn) logoutDesktopBtn.addEventListener('click', lockApp);
if(logoutMobileBtn) logoutMobileBtn.addEventListener('click', lockApp);

// Activiteit bijhouden zodat we na een periode van inactiviteit automatisch kunnen uitloggen
['mousedown','keydown','touchstart','scroll'].forEach(evt=>{
  document.addEventListener(evt, ()=>{ if(!gateEl.classList.contains('hidden')) return; markActivity(); }, {passive:true});
});
setInterval(()=>{
  if(gateEl.classList.contains('hidden')){
    let last = 0;
    try{ last = parseInt(localStorage.getItem(LAST_ACTIVITY_KEY)||'0',10); }catch(e){}
    if(last && (Date.now() - last) > IDLE_TIMEOUT_MS){
      lockApp();
    }
  }
}, 30000);

if(fbAuth){
  fbAuth.onAuthStateChanged(user=>{
    if(user){
      let last = 0;
      try{ last = parseInt(localStorage.getItem(LAST_ACTIVITY_KEY)||'0',10); }catch(e){}
      if(last && (Date.now() - last) > IDLE_TIMEOUT_MS){
        fbAuth.signOut().catch(()=>{});
        return;
      }
      unlockApp();
    } else {
      gateEl.classList.remove('hidden');
      appRootEl.classList.remove('unlocked');
      gateEmailInput.focus();
    }
  });
} else {
  gateError.textContent = 'Inloggen kon niet worden geladen. Ververs de pagina.';
}

})();
</script>
